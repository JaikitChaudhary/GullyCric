<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GullyCric Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, #0f172a 60%);
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(90vw, 32rem);
        padding: 2rem;
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.2);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GullyCric is offline</h1>
      <p>Your app shell is ready, but live scoring needs a connection. Reconnect to continue following the match.</p>
    </main>
  </body>
  </html>
